name: Build APK

on:
  push:
    branches: ["claude/**", main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK / NDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" \
            "ndk;27.2.12479018" "cmake;3.22.1"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build standalone APK
        run: ./gradlew :TMessagesProj_AppStandalone:assembleAfatStandalone --stacktrace

      - name: Collect APK
        run: |
          mkdir -p out
          find TMessagesProj_AppStandalone/build/outputs/apk -name '*.apk' -exec cp {} out/telegram-10-accounts.apk \;
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: telegram-10-accounts-apk
          path: out/telegram-10-accounts.apk
          if-no-files-found: error
